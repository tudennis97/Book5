<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<!-- 8964習維尼中華民國臺獨　創作者：ㄉㄨˋㄕˋㄅㄧㄣ+Claude AI -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學華語向前走 第五冊 遊戲館｜布理斯本亞洲語文學校</title>
<meta name="description" content="《學華語向前走》第五冊（5A、5B）華語練習遊戲總入口：第一課到第十二課與兩個臺灣文化單元，共 16 個遊戲。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 8964習維尼中華民國臺獨　創作者：ㄉㄨˋㄕˋㄅㄧㄣ+Claude AI */
:root{
  --ink:#3a2418; --muted:#6e5544; --paper:#fffaf0; --rule:#e6cfa4;
  --red:#b8322a; --red2:#8f1f1a; --gold:#e2a03e; --gold2:#b9831f;
  --a:#c8553d; --b:#2f6f9e;
  --kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti",serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--kai);color:var(--ink);font-size:17px;line-height:1.6;
  background:
    radial-gradient(circle at 10% 0%, rgba(255,214,140,.6), rgba(255,214,140,0) 42%),
    radial-gradient(circle at 92% 6%, rgba(232,120,90,.32), rgba(232,120,90,0) 40%),
    linear-gradient(#fbf1dc,#f3e2bf);
  background-color:#f3e2bf;min-height:100vh}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
[hidden]{display:none !important}

/* ---------- 開場影片 ---------- */
#intro{position:fixed;inset:0;z-index:50;background:#120806;display:grid;place-items:center;overflow:hidden;
  transition:opacity .7s ease, visibility .7s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#intro .blur{position:absolute;inset:-40px;background:url("intro-poster.jpg") center/cover;filter:blur(28px) brightness(.55) saturate(1.2)}
#intro video{position:relative;height:100dvh;width:auto;aspect-ratio:9/16;max-width:100vw;object-fit:contain;display:block;background:#000;box-shadow:0 0 80px rgba(0,0,0,.6)}
#intro .ctl{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 14px}
#intro .ctl button{font-size:1.15rem;font-weight:700;border-radius:999px;padding:10px 22px;border:2px solid rgba(255,240,210,.85);
  background:rgba(40,14,8,.55);color:#fff3d6;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#intro .ctl button.main{background:linear-gradient(#ffe39a,#e2a03e);color:#2a1208;border-color:#6e4317}
#intro .bar{position:absolute;left:0;right:0;top:0;height:5px;background:rgba(255,255,255,.15)}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2c14e,#e86a4f)}
#intro .tap{position:absolute;inset:0;display:grid;place-items:center}
#intro .tap button{font-size:1.5rem;font-weight:700;border-radius:18px;padding:16px 34px;border:3px solid #6e4317;background:linear-gradient(#ffe39a,#e2a03e);color:#2a1208;box-shadow:0 6px 0 #6e4317}

/* ---------- 首頁 ---------- */
.flags{height:34px;background:
  conic-gradient(from 135deg at 50% 0, #e2553f 0 90deg, transparent 0) 0 0/56px 34px repeat-x,
  conic-gradient(from 135deg at 50% 0, #f2c14e 0 90deg, transparent 0) 14px 0/56px 30px repeat-x;
  filter:drop-shadow(0 3px 2px rgba(90,30,10,.25))}
.flags::before{content:"";display:block;height:3px;background:#7a4a20}
header{max-width:1080px;margin:0 auto;padding:10px 18px 4px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
header h1{margin:0;font-size:clamp(2rem,6.4vw,3.2rem);line-height:1.1;letter-spacing:.08em;color:var(--red2);
  text-shadow:0 2px 0 #fff5dc,0 4px 0 rgba(184,50,42,.18)}
header h1 b{display:inline-grid;place-items:center;width:1.25em;height:1.25em;margin-left:.15em;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#5aa2e6,#1d5fa8);color:#fff;font-size:.78em;vertical-align:.08em;box-shadow:0 0 0 4px #f2c14e}
header p{margin:6px 0 0;color:var(--muted);font-size:1.05rem}
header .tools{display:flex;gap:10px;flex-wrap:wrap}
header .tools button{font-size:1rem;font-weight:700;border-radius:999px;padding:7px 16px;border:2px solid var(--rule);background:var(--paper);color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:10px 18px 30px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.book{background:rgba(255,250,240,.82);border-radius:20px;padding:14px 14px 16px;box-shadow:0 14px 34px -20px rgba(90,40,10,.55);border-top:8px solid var(--c)}
.book.a{--c:var(--a)} .book.b{--c:var(--b)}
.book h2{margin:0 4px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;white-space:nowrap;font-size:1.55rem;letter-spacing:.1em;color:var(--c)}
.book h2 small{white-space:normal;font-size:.95rem;letter-spacing:.02em;color:var(--muted)}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lesson{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;background:#fff;border:2px solid var(--rule);border-radius:14px;padding:10px 12px}
.num{display:grid;place-items:center;width:58px;height:58px;border-radius:14px;background:var(--c);color:#fff;font-weight:700;line-height:1.05;text-align:center;font-size:1.05rem}
.num span{display:block;font-size:.7rem;letter-spacing:.15em;opacity:.85}
.lesson.ext .num{background:linear-gradient(135deg,#2f7d6d,#3e9c7a)}
.lesson h3{margin:0;font-size:1.25rem;line-height:1.3}
.lesson h3 small{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
.games{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.games a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:1.08rem;
  padding:6px 14px 6px 8px;border-radius:999px;background:#fdf3e1;border:2px solid #e9c98e;color:#4a2a12;
  transition:transform .12s, background .12s, box-shadow .12s}
.games a:hover{transform:translateY(-2px);background:#fff4c7;box-shadow:0 6px 12px -8px rgba(90,40,10,.6)}
.games a i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #f0d7a6;font-size:1.15rem}
.note{max-width:1080px;margin:0 auto;padding:0 18px 30px;color:var(--muted);font-size:.92rem}
.note details{background:rgba(255,250,240,.8);border:1px solid var(--rule);border-radius:12px;padding:6px 14px}
.note summary{cursor:pointer;font-weight:700;color:var(--ink)}
.note ul{margin:6px 0 4px;padding-left:1.3em}
</style>
</head>
<body>

<!-- 開場：上傳的動畫影片。播完、按「跳過」或網址帶 #menu 就直接到課程選單 -->
<section id="intro" aria-label="開場影片">
  <div class="blur" aria-hidden="true"></div>
  <video id="v" src="intro.mp4" poster="intro-poster.jpg" playsinline muted preload="auto"></video>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <div class="tap" id="tap" hidden><button type="button" id="btn-play">▶ 播放開場</button></div>
  <div class="ctl">
    <button type="button" id="btn-sound">🔈 開聲音</button>
    <button type="button" class="main" id="btn-skip">跳過，進入遊戲館 ▶</button>
  </div>
</section>

<div class="flags" aria-hidden="true"></div>
<header>
  <div>
    <h1>學華語向前走<b>5</b></h1>
    <p>第五冊遊戲館　5A・5B 共十六個練習遊戲　｜　布理斯本亞洲語文學校</p>
  </div>
  <div class="tools"><button type="button" id="btn-replay">▶ 重播開場</button></div>
</header>

<main id="menu">
  <section class="book a" aria-labelledby="h-a">
    <h2 id="h-a">5A 課本<small>第一課～第六課・臺灣文化單元</small></h2>
    <ol class="lessons" id="list-a"></ol>
  </section>
  <section class="book b" aria-labelledby="h-b">
    <h2 id="h-b">5B 課本<small>第七課～第十二課・臺灣文化單元</small></h2>
    <ol class="lessons" id="list-b"></ol>
  </section>
</main>

<div class="note">
  <details>
    <summary>給老師：成績會寫到哪裡？</summary>
    <ul>
      <li>每個遊戲玩完會自動把成績送到同一份 Google 試算表，每個遊戲各自一個工作表（例如「第一課 打地鼠大作戰」）。</li>
      <li>試算表網址只要設定一次。</li>
      <li>學生的學校、班級、姓名會記在各自的裝置上，下次打開同一個遊戲就不用重打。</li>
    </ul>
  </details>
</div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
/* 8964習維尼中華民國臺獨　創作者：ㄉㄨˋㄕˋㄅㄧㄣ+Claude AI */

/* ---------- 課程與遊戲 ---------- */
var BOOKS = {
  a: [
    { n:"一", t:"參加社團", games:[["mole-club","打地鼠大作戰","🔨"]] },
    { n:"二", t:"中秋團圓", games:[["moon-blocks","月餅拼字方塊","🥮"]] },
    { n:"三", t:"我要買新玩具", games:[["toy-match","玩具量詞消消樂","🧸"]] },
    { n:"四", t:"月餅跟南瓜派", games:[["pumpkin-roll","南瓜滾滾來","🎃"]] },
    { n:"五", t:"迎接新的一年", games:[["new-year","星空煙火防線","🎆"]] },
    { n:"六", t:"成果發表會", sub:"複習一", games:[["pacman-5a06","成果發表會吃豆人","🟡"],["little-chef","我是小廚師","🍳"],["guess-dish","猜猜這是什麼菜（兩隊搶答）","🍽️"]] },
    { ext:true, t:"臺灣文化單元：歌仔戲", sub:"附錄", games:[["opera-cannon","歌仔戲拚戲砲車","🎭"]] }
  ],
  b: [
    { n:"七", t:"我肚子不舒服", games:[["climb-doctor","瘋狂爬樓","🧗"]] },
    { n:"八", t:"籃球比賽", games:[["temple-match","廟埕對打","🏀"]] },
    { n:"九", t:"世界有幾大洲", games:[["tank-world","坦克守城戰","🌏"]] },
    { n:"十", t:"農場怎麼走", games:[["farm-route","問路開車","🚗"]] },
    { n:"十一", t:"紙", games:[["paper-air","F-16 詞語空戰","✈️"]] },
    { n:"十二", t:"保護動物", sub:"複習二", games:[["frog-animal","跳跳蛙過河","🐸"]] },
    { ext:true, t:"臺灣文化單元：臺灣藍鵲", sub:"附錄", games:[["magpie-nest","長尾山娘回巢記","🐦"]] }
  ]
};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
["a","b"].forEach(function(k){
  document.getElementById("list-"+k).innerHTML = BOOKS[k].map(function(L){
    var badge = L.ext ? '<span>附錄</span>'+(k==="a"?"5A":"5B") : '<span>第</span>'+L.n+'<span>課</span>';
    var title = L.ext ? esc(L.t) : "第"+L.n+"課　"+esc(L.t);
    return '<li class="lesson'+(L.ext?" ext":"")+'"><div class="num" aria-hidden="true">'+badge+'</div><div>'+
      '<h3>'+title+(L.sub&&!L.ext?'<small>'+esc(L.sub)+'</small>':'')+'</h3>'+
      '<div class="games">'+L.games.map(function(g){
        return '<a href="'+g[0]+'.html"><i aria-hidden="true">'+g[2]+'</i>'+esc(g[1])+'</a>';
      }).join("")+'</div></div></li>';
  }).join("");
});

/* ---------- 開場影片 ---------- */
var intro=document.getElementById("intro"), v=document.getElementById("v"), prog=document.getElementById("prog");
var tap=document.getElementById("tap"), btnSound=document.getElementById("btn-sound");
function setSound(on){ v.muted=!on; btnSound.textContent=on?"🔊 關聲音":"🔈 開聲音"; }
function showMenu(){
  if(intro.classList.contains("gone")) return;
  intro.classList.add("gone");
  try{ v.pause(); }catch(e){}
  if(location.hash!=="#menu") try{ history.replaceState(null,"","#menu"); }catch(e){}
  document.body.style.overflow="";
}
function playIntro(){
  intro.classList.remove("gone"); document.body.style.overflow="hidden";
  try{ v.currentTime=0; }catch(e){}
  var p=v.play();
  if(p && p.catch) p.then(function(){ tap.hidden=true; }).catch(function(){ tap.hidden=false; });
}
v.addEventListener("timeupdate",function(){ if(v.duration) prog.style.width=(v.currentTime/v.duration*100)+"%"; });
v.addEventListener("ended",function(){ setTimeout(showMenu,400); });
v.addEventListener("error",showMenu);
document.getElementById("btn-skip").addEventListener("click",showMenu);
document.getElementById("btn-play").addEventListener("click",function(){ tap.hidden=true; v.play(); });
btnSound.addEventListener("click",function(){ setSound(v.muted); if(v.paused) v.play(); });
document.getElementById("btn-replay").addEventListener("click",function(){ setSound(true); playIntro(); });
addEventListener("keydown",function(e){ if(!intro.classList.contains("gone") && (e.key==="Escape"||e.key==="Enter")) showMenu(); });

if(location.hash==="#menu"){ intro.classList.add("gone"); }
else { setSound(false); playIntro(); }
})();
</script>
</body>
</html>
